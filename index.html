<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#ffd9a0">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Slice Street">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="A cozy idle pizza stand prototype, for phone and PC.">
  <title>Slice Street</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%2746%27 fill=%27%23e5533d%27/%3E%3Cpath d=%27M50 12 L88 82 L12 82 Z%27 fill=%27%23ffd166%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="scene" aria-label="Pizza stand scene"></canvas>

  <header id="topbar">
    <div class="cash">
      <span class="lbl" data-i18n="hud.cash">Cash</span>
      <span id="cash" class="val">0</span>
    </div>
    <div class="meta">
      <div id="rate" class="rate"></div>
      <div id="goal" class="goal"></div>
    </div>
    <button id="btnBonus" class="icon bonus hidden" data-i18n-aria="bonus.label" aria-label="Happy hour">x2</button>
    <button id="btnSettings" class="icon" data-i18n-aria="action.settings" aria-label="Settings">⚙</button>
    <button id="btnDebug" class="icon hidden" aria-label="Debug">🐞</button>
  </header>

  <div id="events" class="events"></div>
  <div id="hint" class="hint hidden"></div>
  <div id="signs" aria-hidden="true"></div>
  <div id="floats" aria-hidden="true"></div>
  <div id="toasts" aria-live="polite"></div>

  <nav id="actions" aria-label="Actions">
    <button data-action="customers" title="1"><kbd class="key">1</kbd><span class="ico">🙋</span><span class="lbl" data-i18n="action.customers">Order</span><span class="badge" hidden>0</span></button>
    <button data-action="stretch" title="2"><kbd class="key">2</kbd><span class="ico">🫓</span><span class="lbl" data-i18n="action.stretch">Stretch</span><span class="badge" hidden>0</span></button>
    <button data-action="top" title="3"><kbd class="key">3</kbd><span class="ico">🍅</span><span class="lbl" data-i18n="action.top">Topping</span><span class="badge" hidden>0</span></button>
    <button data-action="oven" title="4"><kbd class="key">4</kbd><span class="ico">🔥</span><span class="lbl" data-i18n="action.oven">Oven</span><span class="badge" hidden>0</span></button>
    <button data-action="serve" title="5"><kbd class="key">5</kbd><span class="ico">🍕</span><span class="lbl" data-i18n="action.serve">Serve</span><span class="badge" hidden>0</span></button>
    <button data-action="shop" title="6"><kbd class="key">6</kbd><span class="ico">🛒</span><span class="lbl" data-i18n="action.shop">Shop</span></button>
  </nav>

  <div id="mini" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="sheet mini">
      <header>
        <h2 id="miniTitle"></h2>
        <button id="miniClose" class="icon" aria-label="Close">✕</button>
      </header>
      <p id="miniHint" class="muted"></p>
      <div id="miniBody"></div>
    </div>
  </div>

  <div id="modal" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="sheet">
      <header>
        <h2 id="modalTitle"></h2>
        <button id="modalClose" class="icon" aria-label="Close">✕</button>
      </header>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="loading">Loading…</div>
  <script>
    // If the game cannot start, say so instead of sitting on "Loading…".
    (function () {
      var box = document.getElementById('loading');
      function fail(why) {
        if (!box || box.classList.contains('hidden')) return;
        box.innerHTML = '';
        var p = document.createElement('div');
        p.style.maxWidth = '420px';
        p.textContent = 'The game could not start. Try a hard reload (Ctrl+Shift+R, or Cmd+Shift+R on a Mac). If that does not help: ' + why;
        box.appendChild(p);
      }
      window.addEventListener('error', function (e) {
        fail(e && e.message ? e.message : 'a file failed to load.');
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        fail(e && e.reason && e.reason.message ? e.reason.message : 'an unexpected error.');
      });
      setTimeout(function () { fail('it is taking too long. Your browser may not support WebGL.'); }, 20000);
      window.__pizzaFail = fail;
    })();
  </script>
  <script>
    // Keeps the installed app up to date. A new build is picked up on the next open, and the
    // page reloads once it is safe: when the app is put away, or after two quiet minutes.
    (function () {
      if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
      var waiting = false, timer = 0;
      function reloadNow() { location.reload(); }
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (waiting) return;
        waiting = true;
        if (document.hidden) return reloadNow();
        document.addEventListener('visibilitychange', function () { if (document.hidden) reloadNow(); }, { once: true });
        timer = setTimeout(reloadNow, 2 * 60 * 1000);
      });
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        function check() { reg.update().catch(function () {}); }
        document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
        setInterval(check, 30 * 60 * 1000);
      }).catch(function () {});
    })();
  </script>
  <script src="game.bundle.js?v=7d065e94"></script>
</body>
</html>
